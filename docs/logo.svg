<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KaraKo">
  <title>KaraKo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202b38"/>
      <stop offset="1" stop-color="#0c1116"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e8e2d4"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a05a"/>
      <stop offset="1" stop-color="#d2743a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- e-reader tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- the page -->
  <g filter="url(#shadow)">
    <rect x="32" y="28" width="60" height="72" rx="7" fill="url(#paper)"/>
  </g>

  <!-- saved-article ribbon, folded over the page edge -->
  <path d="M72 28 h14 v38 l-7-6.5 -7 6.5 z" fill="url(#ribbon)"/>
  <path d="M72 28 h14 v38 l-7-6.5" fill="#ffffff" fill-opacity="0.18"/>
  <path d="M72 28 h14" stroke="#8a4a26" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- text lines, stopping short of the ribbon -->
  <g fill="#b8b0a0">
    <rect x="41" y="47" width="24" height="3.4" rx="1.7"/>
    <rect x="41" y="56" width="38" height="3.4" rx="1.7"/>
    <rect x="41" y="65" width="20" height="3.4" rx="1.7"/>
  </g>
  <g fill="#cfc7b6">
    <rect x="41" y="79" width="34" height="3.4" rx="1.7"/>
    <rect x="41" y="88" width="27" height="3.4" rx="1.7"/>
  </g>

  <!-- sync tick: the one bit that is not paper -->
  <circle cx="100" cy="99" r="10" fill="#202b38" stroke="#f0a05a" stroke-width="2.6"/>
  <path d="M96 99.3 l2.7 2.8 5.4-5.9" fill="none" stroke="#f0a05a"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
